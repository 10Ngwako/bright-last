<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Potential | BrightPath</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

    <div class="logo">
        Bright<span>Path</span>
    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="portfolio.html">Portfolio</a>

    </div>

    <div id="navAuth"></div>

</nav>


<main class="page-container">

    <div class="page-header">

        <div class="badge">
            STEP 2
        </div>

        <h1>Discover Your Potential</h1>

        <p>
            Answer a few questions about how you like to work and think.
        </p>

    </div>


    <form id="assessmentForm">

        <div class="question-card">

            <h2>
                What do you enjoy doing most?
            </h2>

            <label class="option">
                <input
                    type="radio"
                    name="q1"
                    value="technology"
                    required
                >
                Building things with technology
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q1"
                    value="people"
                >
                Helping and working with people
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q1"
                    value="business"
                >
                Starting businesses and solving problems
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q1"
                    value="creative"
                >
                Creating designs, stories or art
            </label>

        </div>


        <br>


        <div class="question-card">

            <h2>
                Which problem would you rather solve?
            </h2>

            <label class="option">
                <input
                    type="radio"
                    name="q2"
                    value="technology"
                    required
                >
                How can we make software faster?
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q2"
                    value="people"
                >
                How can we improve people's lives?
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q2"
                    value="business"
                >
                How can a business grow?
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q2"
                    value="creative"
                >
                How can we communicate an idea better?
            </label>

        </div>


        <br>


        <div class="question-card">

            <h2>
                How do you prefer to work?
            </h2>

            <label class="option">
                <input
                    type="radio"
                    name="q3"
                    value="technology"
                    required
                >
                Independently with computers
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q3"
                    value="people"
                >
                In a team helping others
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q3"
                    value="business"
                >
                Leading a team
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="q3"
                    value="creative"
                >
                In a creative environment
            </label>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-button"
                    style="border:none; cursor:pointer;"
                >
                    See My Results →
                </button>

            </div>

        </div>

    </form>

</main>


<script src="js/auth.js"></script>
<script src="js/potential.js"></script>

</body>
</html>
